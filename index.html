<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mantine-color-scheme-value') || localStorage.getItem('vite-ui-theme');
          var isDark = saved ? saved === 'dark' : true; // Default to dark luxury theme
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <title>Yonatan Car Decor</title>
  </head>
  <body class="antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
